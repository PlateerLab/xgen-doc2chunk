name: Sync mirror repo

# master0419/xgen_doc2chunk <-> PlateerLab/xgen-doc2chunk 양방향 동기화.
# 이 파일은 두 저장소에 동일하게 존재해야 하며, 자신이 어느 저장소인지 보고 상대편을 결정한다.
# - 강제 push는 하지 않는다. non-fast-forward 면 실패로 멈추고, 사람이 로컬에서 머지한다.
# - 상대편에 push 해도 상대편 트리가 이미 같으면 ref 변경이 없어 재트리거되지 않는다 (루프 없음).
# - SYNC_TOKEN: 상대 저장소 Contents:write 권한이 있는 PAT (repo secret).

on:
  push:
    branches: [main, deploy]
  workflow_dispatch:

concurrency:
  group: sync-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve mirror target
        id: target
        run: |
          case "${{ github.repository }}" in
            master0419/xgen_doc2chunk) echo "repo=PlateerLab/xgen-doc2chunk" >> "$GITHUB_OUTPUT" ;;
            PlateerLab/xgen-doc2chunk) echo "repo=master0419/xgen_doc2chunk" >> "$GITHUB_OUTPUT" ;;
            *) echo "Unknown repository ${{ github.repository }}; nothing to sync"; echo "repo=" >> "$GITHUB_OUTPUT" ;;
          esac

      - uses: actions/checkout@v4
        if: steps.target.outputs.repo != ''
        with:
          fetch-depth: 0

      - name: Push ${{ github.ref_name }} to ${{ steps.target.outputs.repo }}
        if: steps.target.outputs.repo != ''
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          if [ -z "$SYNC_TOKEN" ]; then
            echo "::error::SYNC_TOKEN secret is not set in ${{ github.repository }}"; exit 1
          fi
          git remote add mirror "https://x-access-token:${SYNC_TOKEN}@github.com/${{ steps.target.outputs.repo }}.git"
          git fetch mirror "${{ github.ref_name }}" || true
          if git rev-parse --verify -q "mirror/${{ github.ref_name }}" >/dev/null \
             && ! git merge-base --is-ancestor "mirror/${{ github.ref_name }}" HEAD; then
            echo "::error::${{ steps.target.outputs.repo }}:${{ github.ref_name }} has commits not in this repo. Merge manually (no force push)."
            git log --oneline "HEAD..mirror/${{ github.ref_name }}"
            exit 1
          fi
          git push mirror "HEAD:refs/heads/${{ github.ref_name }}"
          echo "Synced ${{ github.repository }}:${{ github.ref_name }} -> ${{ steps.target.outputs.repo }}"
